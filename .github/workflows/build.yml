name: Foundation build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore HavenSupport.slnx --locked-mode
      - run: dotnet build HavenSupport.slnx --no-restore --configuration Release
      - run: dotnet test HavenSupport.slnx --no-build --configuration Release --filter 'Category!=Sql' --logger trx
      - run: dotnet format HavenSupport.slnx --verify-no-changes --no-restore
      - run: dotnet run --project tests/HavenSupport.Evaluation --configuration Release --no-build -- --providers pdf
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/haven-support-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: src/haven-support-web/package-lock.json
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
